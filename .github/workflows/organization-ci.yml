name: Organization CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    uses: calan-co/cicd-shared-pipeline/.github/workflows/reusable-repository-hygiene.yml@v1
  node:
    uses: calan-co/cicd-shared-pipeline/.github/workflows/reusable-node-ci.yml@v1
    with:
      node-version: "24"
      package-manager: pnpm
      cache-dependency-path: pnpm-lock.yaml
      working-directory: .
      fetch-depth: 0
      install-command: mkdir -p "$(pnpm store path)"
      enable-lint: true
      enable-typecheck: false
      enable-tests: true
      enable-build: false
      lint-command: node scripts/validate-release-artifacts.mjs && node scripts/validate-artifact-baseline.mjs && node scripts/validate-migration-ledger.mjs
      test-command: node --test test/validators/*.test.mjs
